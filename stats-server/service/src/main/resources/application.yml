server:
  port: 9090

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    driverClassName: org.postgresql.Driver
    # url: jdbc:postgresql://localhost:5432/stat-server
    url: jdbc:postgresql://stats-db:5432/stat-server
    username: stat-server
    password: stat-server
    hikari:
      connection-timeout: 3000
      max-lifetime: 5

logging:
  level:
    root: INFO
