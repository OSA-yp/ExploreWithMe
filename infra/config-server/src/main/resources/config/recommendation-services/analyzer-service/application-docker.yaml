server:
  port: 8092

spring:
  application:
    name: analyzer
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: analyzer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/ewm_analyzer
    username: postgres
    password: password

grpc:
  server:
    port: 0

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    hostname: analyzer-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
