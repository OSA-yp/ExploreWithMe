server:
  port: 8080

spring:
  application:
    name: collector
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer

grpc:
  server:
    port: 0

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    hostname: collector-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
