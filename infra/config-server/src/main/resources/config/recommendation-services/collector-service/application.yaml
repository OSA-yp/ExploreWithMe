spring:
  application:
    name: collector
  cloud:
    config:
      fail-fast: false
      retry:
        useRandomPolicy: true
        initial-interval: 1000
        max-interval: 30000
        multiplier: 1.5
        max-attempts: 0
      discovery:
        enabled: true
        serviceId: config-server
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer

grpc:
  server:
    port: 0

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    hostname: collector-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
