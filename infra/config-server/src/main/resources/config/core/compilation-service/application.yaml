server:
  port: 8086
  error:
    include-binding-errors: always

spring:
  application:
    name: compilation-service
  cloud:
    config:
      fail-fast: false
      retry:
        useRandomPolicy: true
        initial-interval: 1000
        max-interval: 30000
        multiplier: 1.5
        max-attempts: 0
      discovery:
        enabled: true
        serviceId: config-server
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/ewm_compilation
    username: postgres
    password: password

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_SERVER_HOST:discovery-server}:${EUREKA_SERVER_PORT:8761}/eureka/
  instance:
    preferIpAddress: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: "${spring.application.name}:${random.value}"

management:
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      enabled: true
      show-details: always

