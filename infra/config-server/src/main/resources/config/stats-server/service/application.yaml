server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: stats-server
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://stats-db:5432/stat-server
    username: stat-server
    password: stat-server
    hikari:
      connection-timeout: 3000
      max-lifetime: 5

logging:
  level:
    root: INFO

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_SERVER_HOST:discovery-server}:${EUREKA_SERVER_PORT:8761}/eureka/
  instance:
    preferIpAddress: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
