syntax = "proto3";

package stats.service;

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.proto";
option java_outer_classname = "StatsProto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

// Enum для типов действий пользователя
enum ActionTypeProto {
  ACTION_VIEW = 0;
  ACTION_REGISTER = 1;
  ACTION_LIKE = 2;
}

// Сообщение о действии пользователя
message UserActionProto {
  int64 user_id = 1;
  int64 event_id = 2;
  ActionTypeProto action_type = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// Запрос рекомендаций для пользователя
message UserPredictionsRequestProto {
  int64 user_id = 1;
  int32 max_results = 2;
}

// Запрос похожих мероприятий
message SimilarEventsRequestProto {
  int64 event_id = 1;
  int64 user_id = 2;
  int32 max_results = 3;
}

// Запрос количества взаимодействий
message InteractionsCountRequestProto {
  repeated int64 event_id = 1;
}

// Запрос проверки взаимодействия пользователя с мероприятием
message UserEventInteractionRequestProto {
  int64 user_id = 1;
  int64 event_id = 2;
}

// Рекомендуемое мероприятие
message RecommendedEventProto {
  int64 event_id = 1;
  double score = 2;
}

// Сервис для сбора действий пользователей
service UserActionController {
  rpc CollectUserAction(UserActionProto) returns (google.protobuf.Empty);
}

// Сервис для получения рекомендаций
service RecommendationsController {
  rpc GetRecommendationsForUser(UserPredictionsRequestProto) returns (stream RecommendedEventProto);
  rpc GetSimilarEvents(SimilarEventsRequestProto) returns (stream RecommendedEventProto);
  rpc GetInteractionsCount(InteractionsCountRequestProto) returns (stream RecommendedEventProto);
  rpc HasUserInteractedWithEvent(UserEventInteractionRequestProto) returns (google.protobuf.BoolValue);
}
