server:
  port: 8090

spring:
  application:
    name: collector
  config:
    import: "optional:configserver:"
  cloud:
    config:
      fail-fast: false
      retry:
        useRandomPolicy: true
        initial-interval: 1000
        max-interval: 30000
        multiplier: 1.5
        max-attempts: 0
      discovery:
        enabled: true
        serviceId: config-server
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

grpc:
  server:
    port: 0

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info
