server:
  port: 8080
  error:
    include-binding-errors: always

spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:ewm-service
    username: ewm-service
    password: ewm-service
    hikari:
      connection-timeout: 3000
      max-lifetime: 5

logging:
  level:
    root: INFO
    org.zalando.logbook: INFO
  file:
    name: logs/ewm-service.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

ewm:
  ewm-service:
    name: ewm-service
  stats-server:
    url: http://localhost:9090
